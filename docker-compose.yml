services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lol
      POSTGRES_USER: lol
      POSTGRES_PASSWORD: lol
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lol -d lol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
